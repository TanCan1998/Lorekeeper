<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>沉浸写作</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111113}
a{color:#A9BEF0}a:hover{color:#C8D6F7}
.tool{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:0;border-radius:8px;background:transparent;font:500 12.5px "Noto Sans SC",sans-serif;color:#E6E4DF;cursor:pointer}
.tool:hover{background:rgba(255,255,255,.08)}
</style>
</helmet>
<div style="height: 100vh; min-height: 720px; display: flex; flex-direction: column; background: #111113; color: #E6E4DF; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; font-size: 13px; line-height: 1.55; -webkit-font-smoothing: antialiased">

  <header style="height: 46px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 0 0 20px; color: #8B8A93">
    <span style="font: italic 18px 'Instrument Serif', serif; color: #A9BEF0">3</span>
    <span style="font: 500 13px 'Noto Serif SC', serif; color: #C9C7C1">雨夜车站</span>
    <span style="font-size: 12px">草稿 v2</span>
    <div style="flex: 1"></div>
    <button style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: transparent; font: 400 12px 'Noto Sans SC', sans-serif; color: #A3A2AB; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 10l7-7m-1 7h-6V4M3 21l7-7m-6 0h6v6"></path></svg>退出沉浸<kbd style="font: 500 10.5px 'Noto Sans SC', sans-serif; color: #77767F; border: 1px solid rgba(255,255,255,.12); border-radius: 4px; padding: 0 4px">Esc</kbd></button>
    <div style="display: flex; height: 46px">
      <button aria-label="最小化" style="width: 46px; border: 0; background: transparent; color: #77767F; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
      <button aria-label="最大化" style="width: 46px; border: 0; background: transparent; color: #77767F; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="16" height="16" x="4" y="4" rx="2"></rect></svg></button>
      <button aria-label="关闭" style="width: 46px; border: 0; background: transparent; color: #77767F; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: auto; background: radial-gradient(1100px 520px at 50% -160px, rgba(169,190,240,.07), transparent 70%)">
    <article style="max-width: 640px; margin: 0 auto; padding: 72px 24px 120px">
      <div style="font: 400 12px 'Noto Serif SC', serif; letter-spacing: .24em; color: #77767F">第三章</div>
      <h1 style="margin: 14px 0 44px; font: 600 40px/1.2 'Noto Serif SC', serif; letter-spacing: .03em; color: #F2F0EB">雨夜车站</h1>
      <div style="position: relative; font: 19px/2.1 'Noto Serif SC', serif; color: #DDDBD5; display: flex; flex-direction: column">
        <p style="margin: 0; text-indent: 2em; color: #8B8A93">雨从傍晚开始就没有停过。林舟站在空荡的站台上，手里攥着那封没有署名的信，信封的边角已经被雨水泡软。</p>
        <p style="margin: 0; text-indent: 2em; color: #8B8A93">最后一班列车晚点了十七分钟，广播里的道歉一遍遍落进空无一人的站台。</p>
        <p style="margin: 0; text-indent: 2em">他第三次展开信纸。字迹很淡，只有一行：十一点四十分，第三节车厢，不要回头。</p>
        <p style="margin: 0; text-indent: 2em">站台尽头的灯闪了一下。<span style="background: rgba(169,190,240,.22); border-radius: 2px; color: #F2F0EB">有人从雨里走过来，脚步很轻，伞压得很低，看不见脸。</span>林舟把信折好，塞回大衣内侧的口袋。</p>

        <div role="toolbar" aria-label="选中文字的操作" style="position: absolute; left: 140px; top: 236px; display: flex; gap: 2px; padding: 4px; border-radius: 11px; background: #2A2A30; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 18px 40px -10px rgba(0,0,0,.7)">
          <button class="tool"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A9BEF0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.64 3.64l-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72M14 7l3 3"></path></svg>润色</button>
          <button class="tool">扩写</button>
          <button class="tool">续写</button>
          <button class="tool">改成对话</button>
        </div>

        <p style="margin: 52px 0 0; text-indent: 2em">列车进站的声音先于灯光抵达。铁轨开始震动，雨水在枕木间溅起细碎的白。<span style="display: inline-block; width: 2px; height: 1.15em; vertical-align: -0.18em; background: #A9BEF0"></span></p>
      </div>
    </article>
  </main>

  <footer style="height: 38px; flex: none; display: flex; align-items: center; justify-content: center; gap: 22px; font-size: 12px; color: #6B6A73">
    <span>1,286 / 3,000 字</span>
    <span style="width: 120px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, #A9BEF0 43%, rgba(255,255,255,.08) 43%)"></span>
    <span>已保存</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
