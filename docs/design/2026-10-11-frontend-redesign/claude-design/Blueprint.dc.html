          <a href="Blueprint.dc.html" class="plan"><span style="font: italic 18px 'Instrument Serif', serif; color: #8A8A93">1</span><span>灰色的信</span><span style="font-size: 11px; color: #2F6B4F">定稿</span></a>

                <span style="height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(23,23,26,.1)">阿满</span>
                <button style="height: 28px; padding: 0 10px; border: 1px dashed rgba(23,23,26,.2); border-radius: 999px; background: transparent; font: 400 12.5px 'Noto Sans SC', sans-serif; color: #8A8A93; cursor: pointer">添加</button>

            </div>

              <div class="fld"><label for="hook">悬念钩子</label><textarea id="hook" class="ctl" rows="3">阅读灯下的座位上放着一张 1998 年的车票，乘客姓名一栏写着林舟。</textarea></div>
            </div>
            <div class="fld"><label for="guide">作者微操指导 <span style="font-weight: 400; color: #8A8A93">写作此章时一并交给 AI</span></label><textarea id="guide" class="ctl" rows="2" style="box-shadow: 0 0 0 3px rgba(44,74,140,.10); border-color: rgba(44,74,140,.55)">母亲的声音只出现一次，不要解释来源。老周的台词要短，像是背熟的规矩。</textarea></div>
            <div class="fld"><label for="points">章节要点</label><textarea id="points" class="ctl" rows="3">列车驶出站台后，车窗外的景色停在 1998 年。
老周第一次说出「不要回头」的规矩。
阿满出现在座位旁，没有人看得见她，除了林舟。</textarea></div>
          </div>
        </div>
      </div>
