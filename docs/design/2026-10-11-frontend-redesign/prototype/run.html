<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运行 · 进行中</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<style>
  /* 运行侧页的任务卡 */
  .job { border: 1px solid var(--rule); border-radius: var(--radius-lg); background: var(--paper); }
  .job[data-tone="ask"] { border-color: var(--accent-line); }
  .job-head { display: flex; align-items: center; gap: var(--s-2); padding: 10px 8px 10px var(--s-3); }
  .job-title { flex: 1; min-width: 0; font-weight: 600; }
  .job-title small { display: block; font-weight: 400; color: var(--ink-3); font-size: var(--fs-12); }
  .job-body { padding: 0 var(--s-3) var(--s-3); display: flex; flex-direction: column; gap: 10px; }
  .job-meter { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: var(--fs-12); font-variant-numeric: tabular-nums; }
  .job-meter .meter { flex: 1; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .step { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; min-height: 22px; font-size: var(--fs-12); color: var(--ink-2); }
  .step[data-s="done"] .i { color: var(--ok); }
  .step[data-s="now"] { color: var(--ink); font-weight: 500; }
  .step[data-s="now"] .i { color: var(--accent); }
  .step[data-s="todo"] { color: var(--ink-3); }
  .step span { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
  .live { padding: 10px 12px; border-radius: var(--radius); background: var(--sunken); font: 13px/1.9 var(--font-prose); color: var(--ink-2); }
  .live-label { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font: 500 var(--fs-11)/1.4 var(--font-ui); color: var(--ink-3); letter-spacing: .04em; }
  .caret { display: inline-block; width: 1.5px; height: 1.05em; margin-left: 2px; vertical-align: -2px; background: var(--accent); }
  .job-foot { display: flex; align-items: center; gap: 4px; }
  .job-foot .muted { margin-right: auto; font-size: var(--fs-12); }
  .cand { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px solid var(--rule); }
  .cand-name { min-width: 0; font-weight: 500; white-space: nowrap; }
  .cand-name small { display: flex; align-items: center; gap: 2px; color: var(--accent); font-weight: 400; font-size: var(--fs-11); }
  .cand .seg button { padding: 0 8px; }
  .confirm-row { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: var(--radius); background: var(--danger-soft); color: var(--danger); font-size: var(--fs-12); }
  .confirm-row span { flex: 1; }
  .writing { margin-top: var(--s-6); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-loader-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></symbol>
</defs></svg>

<template id="screen">
  <div class="manuscript-bg">
    <article class="page">
      <div class="eyebrow">第 4 章 · 发展</div>
      <div class="chapter-head">
        <h1 class="chapter-h1">第三节车厢</h1>
        <span class="badge run accent">正在生成草稿</span>
      </div>
      <ol class="life" aria-label="本章进度" style="margin-top:22px">
        <li data-s="now"><span class="node"></span>写作</li>
        <li data-s="todo"><span class="node"></span>审稿</li>
        <li data-s="todo"><span class="node"></span>修稿</li>
        <li data-s="todo"><span class="node"></span>定稿</li>
      </ol>
      <div class="chapter-actions">
        <button class="btn btn-secondary" disabled><svg class="i"><use href="#i-list-checks"/></svg>AI 审稿</button>
        <span class="hint">草稿生成完再审稿</span>
      </div>
      <div class="empty writing">
        <svg class="i"><use href="#i-feather"/></svg>
        <div class="empty-title">第 4 章正在写</div>
        <p>写完会以草稿 v1 出现在这里。进度和实时输出在右侧“运行”里。</p>
      </div>
    </article>
  </div>
</template>

<template id="sheet">
  <div class="sheet-head">
    <div><div class="sheet-title">运行</div><div class="sheet-sub">2 项进行中 · 1 项等你确认</div></div>
    <button class="btn btn-ghost btn-sm btn-icon" aria-label="收起运行"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="sheet-tabs" role="tablist">
    <button class="sheet-tab" role="tab" aria-selected="true">进行中</button>
    <button class="sheet-tab" role="tab" aria-selected="false">历史</button>
    <button class="sheet-tab" role="tab" aria-selected="false">诊断</button>
  </div>
  <div class="sheet-body">

    <section class="job" data-tone="ask" aria-label="等待你确认">
      <div class="job-head">
        <span class="badge accent">等你确认</span>
        <div class="job-title">第 4 章出现 2 个新人物</div>
        <button class="btn btn-primary btn-sm">确认并继续</button>
      </div>
      <div class="job-body">
        <div class="cand">
          <div class="cand-name">穿灰大衣的女人<small>对应：林舟的母亲 <svg class="i i-sm"><use href="#i-chevron-down"/></svg></small></div>
          <div class="seg"><button aria-pressed="true">对应已有角色</button><button aria-pressed="false">新建</button><button aria-pressed="false">暂不采用</button></div>
        </div>
        <div class="cand">
          <div class="cand-name">列车员老周</div>
          <div class="seg"><button aria-pressed="false">对应已有角色</button><button aria-pressed="true">新建</button><button aria-pressed="false">暂不采用</button></div>
        </div>
      </div>
    </section>

    <section class="job" aria-label="当前任务">
      <div class="job-head">
        <svg class="i" style="color:var(--accent)"><use href="#i-loader-circle"/></svg>
        <div class="job-title">第 4 章 · 生成草稿<small>62% · 21:26 开始 · DeepSeek V4 Flash</small></div>
        <button class="btn btn-ghost btn-sm"><svg class="i i-sm"><use href="#i-circle-stop"/></svg>取消</button>
      </div>
      <div class="job-body">
        <ol class="steps">
          <li class="step" data-s="done"><svg class="i i-sm"><use href="#i-circle-check"/></svg>读取蓝图与前情<span>2 秒</span></li>
          <li class="step" data-s="done"><svg class="i i-sm"><use href="#i-circle-check"/></svg>查找相关资料<span>4 秒</span></li>
          <li class="step" data-s="done"><svg class="i i-sm"><use href="#i-circle-check"/></svg>写细纲<span>18 秒</span></li>
          <li class="step" data-s="now"><svg class="i i-sm"><use href="#i-loader-circle"/></svg>写正文 · 第 3 / 5 节<span>篇幅预算 1,940 / 3,000 字 <svg class="i i-sm"><use href="#i-chevron-right"/></svg></span></li>
          <li class="step" data-s="todo"><svg class="i i-sm"><use href="#i-circle-dashed"/></svg>保存为草稿 v1<span></span></li>
        </ol>
        <div class="live">
          <div class="live-label"><span class="dot run"></span>实时输出</div>
          窗外的雨更密了。林舟把车票翻过来，又翻回去。他想问是谁在等<span class="caret"></span>
        </div>
      </div>
    </section>

    <section class="job" aria-label="批量创作">
      <div class="job-head">
        <svg class="i" style="color:var(--ink-3)"><use href="#i-clock"/></svg>
        <div class="job-title">批量创作 · 第 5～8 章<small>0 / 4 · 排队中，第 4 章完成后开始</small></div>
        <button class="btn btn-ghost btn-sm btn-icon" aria-label="暂停批量创作"><svg class="i i-sm"><use href="#i-pause"/></svg></button>
        <button class="btn btn-ghost btn-sm btn-icon" aria-label="取消批量创作"><svg class="i i-sm"><use href="#i-circle-stop"/></svg></button>
      </div>
    </section>

    <section class="job" aria-label="恢复候选">
      <div class="job-head">
        <svg class="i" style="color:var(--warn)"><use href="#i-rotate-ccw"/></svg>
        <div class="job-title">恢复候选 · 第 3 章修稿<small>今天 18:40 中断，留下 860 字未写入的修稿</small></div>
      </div>
      <div class="job-body">
        <div class="job-foot">
          <button class="btn btn-ghost btn-sm"><svg class="i i-sm"><use href="#i-copy"/></svg>复制</button>
          <button class="btn btn-ghost btn-sm"><svg class="i i-sm"><use href="#i-square-pen"/></svg>继续编辑</button>
          <button class="btn btn-ghost btn-sm" aria-expanded="true">放弃…</button>
        </div>
        <div class="confirm-row" role="alert"><span>放弃后这 860 字无法找回</span>
          <button class="btn btn-ghost btn-sm">保留</button><button class="btn btn-danger-solid btn-sm">放弃</button></div>
      </div>
    </section>

  </div>
</template>

<script src="icons.js"></script>
<script src="shell.js"></script>
<script>
Shell.mount({
  title: '运行 · 进行中', stage: 'text', chapter: 4, crumbs: ['正文', '第 4 章'], saved: true,
  run: { label: '第 4 章 · 生成草稿', pct: 62, open: true },
});
</script>
</body>
</html>
