<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>导入作者原稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<style>
  /* 对话框内的选项卡片与小节 */
  .dlg-sec + .dlg-sec { margin-top: var(--s-4); }
  .dlg-sec > .label { margin-bottom: 8px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
  .opts.one { grid-template-columns: 1fr; }
  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); cursor: pointer; }
  .opt[data-on="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .opt .radio-dot, .opt .check-box { margin-top: 2px; }
  .opt b { display: block; font-weight: 500; }
  .opt small { display: block; margin-top: 2px; font-size: var(--fs-12); color: var(--ink-3); line-height: 1.55; }
  .with-btn { display: flex; gap: var(--s-2); }
  .with-btn > :first-child { flex: 1; }
  .mono { font-family: var(--font-mono); font-size: var(--fs-12); }
  .note-box { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--radius); background: var(--sunken); font-size: var(--fs-12); color: var(--ink-2); line-height: 1.6; }
  .note-box .i { margin-top: 1px; color: var(--ink-3); }
  .note-box.warn { background: var(--warn-soft); }
  .note-box.warn .i { color: var(--warn); }
  .note-box.danger { background: var(--danger-soft); color: var(--ink); }
  .note-box.danger .i { color: var(--danger); }
  .note-box b { font-weight: 600; }
  .note-box ul { margin: 4px 0 0; padding-left: 16px; }
  .file-row { display: flex; align-items: center; gap: var(--s-3); padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); }
  .file-row .i { color: var(--ink-3); }
  .file-row small { display: block; font-size: var(--fs-12); color: var(--ink-3); }
  .est { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
  .est div { padding: 8px 12px; border-radius: var(--radius); background: var(--sunken); }
  .est b { display: block; font: 500 18px/1.3 var(--font-num); }
  .est span { font-size: var(--fs-11); color: var(--ink-3); }
</style>
</head>
<body>
<template id="screen">
  <div class="manuscript-bg">
    <article class="page">
      <div class="eyebrow">第 3 章 · 发展</div>
      <div class="chapter-head">
        <h1 class="chapter-h1">雨夜车站</h1>
        <button class="version">草稿 v2 · 1,286 字 <svg class="i i-sm"><use href="#i-chevron-down"/></svg></button>
      </div>
      <div class="prose" style="margin-top:var(--s-8)">
        <p>雨从傍晚开始就没有停过。林舟站在空荡的站台上，手里攥着那封没有署名的信，信封的边角已经被雨水泡软。</p>
        <p>最后一班列车晚点了十七分钟。广播里的女声重复着同一句道歉，像是在对一个并不存在的人群说话。</p>
        <p>他第三次展开信纸。字迹很淡，只有一行：十一点四十分，第三节车厢，不要回头。</p>
        <p>站台尽头的灯闪了一下。有人从雨里走过来，脚步很轻，伞压得很低，看不见脸。</p>
      </div>
    </article>
  </div>
</template>

<template id="overlay">
  <div class="scrim">
    <div class="dialog dialog-wide" role="dialog" aria-labelledby="dt">
      <div class="dialog-head">
        <div class="eyebrow">小说拆解与仿写</div>
        <div class="dialog-title" id="dt" style="margin-top:4px">导入作者原稿</div>
        <p class="dialog-desc">把已经写好的章节拆成蓝图和草稿，接着在这里写下去。</p>
      </div>
      <div class="dialog-body">
        <div class="note-box warn" style="margin-bottom:var(--s-4)"><svg class="i"><use href="#i-history"/></svg>
          <div style="flex:1">上次导入的《北站旧稿.txt》停在第 12 章。</div>
          <button class="btn btn-secondary btn-sm">继续上次导入</button><button class="btn btn-ghost btn-sm">重新开始</button></div>
        <div class="dlg-sec"><div class="label">这份文本是</div>
          <div class="opts"><div class="opt check" data-on="false"><span class="radio-dot"></span><div><b>参考小说</b><small>拆解结构与写法用来仿写，原文不进作品。</small></div></div><div class="opt check" data-on="true"><span class="radio-dot"></span><div><b>我的原稿</b><small>你自己写的章节，导入后可以继续写、审稿和修稿。</small></div></div></div></div>
        <div class="dlg-sec"><div class="label">导入到</div>
          <div class="opts"><div class="opt check" data-on="false"><span class="radio-dot"></span><div><b>新作品</b><small>另建一部作品，需要填写名称和保存位置。</small></div></div><div class="opt check" data-on="true"><span class="radio-dot"></span><div><b>当前作品《雨夜列车》</b><small>与已有章节按章号对齐。</small></div></div></div></div>
        <div class="dlg-sec"><div class="label">文件</div>
          <div class="file-row"><svg class="i i-lg"><use href="#i-file-text"/></svg><div style="flex:1"><div>雨夜列车_手写稿.txt</div><small>38,420 字 · 识别出 12 章</small></div><button class="btn btn-ghost btn-sm">更换文件…</button></div></div>
        <div class="dlg-sec"><div class="label">与现有内容的关系</div>
          <div class="note-box"><svg class="i"><use href="#i-info"/></svg><div>
            <ul style="margin:0">
              <li>第 1、2 章已定稿，<b>跳过</b>，不改动。</li>
              <li>第 3、4 章已有草稿，导入的内容<b>另存为新草稿</b>，原稿保留。</li>
              <li>第 5～12 章是新的，直接导入为草稿并补出蓝图。</li>
            </ul></div></div></div>
        <div class="dlg-sec"><div class="label">预计 <em>使用 DeepSeek V4 Flash</em></div>
          <div class="est"><div><b>10 章</b><span>需要拆解</span></div><div><b>约 40 次</b><span>调用 AI</span></div><div><b>约 15 分钟</b><span>可在后台进行</span></div></div></div>
      </div>
      <div class="dialog-foot">
        <span class="note">开始后可在顶栏的运行面板查看进度</span>
        <button class="btn btn-ghost">取消</button>
        <button class="btn btn-primary">开始导入</button>
      </div>
    </div>
  </div>
</template>

<script src="icons.js"></script>
<script src="shell.js"></script>
<script>
Shell.mount({ title: '导入作者原稿', stage: 'text', chapter: 3, crumbs: ['正文', '第 3 章'], saved: true });
</script>
</body>
</html>
