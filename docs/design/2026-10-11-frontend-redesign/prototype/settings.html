<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · AI 模型</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<style>
  /* 设置页骨架：左侧分组导航 + 右侧内容 */
  .set { display: grid; grid-template-columns: 220px 1fr; min-height: 100%; }
  .set-nav { padding: var(--s-8) var(--s-3) var(--s-6); border-right: 1px solid var(--rule); background: var(--bg); }
  .set-nav-title { padding: 0 var(--s-3); font: 600 var(--fs-20)/1.3 var(--font-display); }
  .set-group { margin-top: var(--s-6); }
  .set-group-label { padding: 0 var(--s-3) var(--s-1); font-size: var(--fs-11); letter-spacing: .14em; color: var(--ink-3); }
  .set-link { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius); color: var(--ink-2); cursor: pointer; }
  .set-link:hover { background: var(--surface-2); color: var(--ink); }
  .set-link[aria-current="page"] { background: var(--surface); color: var(--accent); box-shadow: inset 0 0 0 1px var(--rule); font-weight: 500; }
  .set-body { padding: var(--s-8) var(--s-12) var(--s-12); min-width: 0; }
  .set-inner { max-width: 760px; }

  .model { border: 1px solid var(--rule); border-radius: var(--radius-lg); background: var(--surface); }
  .model[data-open="true"] { border-color: var(--accent-line); }
  .model-row { display: flex; align-items: center; gap: var(--s-3); padding: 12px var(--s-4); }
  .model-mark { width: 32px; height: 32px; border-radius: var(--radius); display: grid; place-items: center; background: var(--sunken); color: var(--ink-2); }
  .model-name { font-weight: 600; }
  .model-meta { font-size: var(--fs-12); color: var(--ink-3); }
  .model-act { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .model-form { padding: var(--s-4) var(--s-4) var(--s-5); border-top: 1px solid var(--rule); }
  .with-btn { display: flex; gap: var(--s-2); }
  .with-btn > :first-child { flex: 1; }
  .mono { font-family: var(--font-mono); font-size: var(--fs-12); }
  .test-ok { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-size: var(--fs-12); }
  .form-foot { display: flex; align-items: center; gap: var(--s-2); margin-top: var(--s-5); padding-top: var(--s-4); border-top: 1px solid var(--rule); }
  .form-foot .spacer { flex: 1; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575a1 1 0 0 1 0 .696a10.8 10.8 0 0 1-1.444 2.49m-6.41-.679a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151a1 1 0 0 1 0-.696a10.75 10.75 0 0 1 4.446-5.143M2 2l20 20"/></symbol>
</svg>
<template id="screen">
  <div class="set">
    <nav class="set-nav" aria-label="设置分组">
      <div class="set-nav-title">设置</div>
      <div class="set-group">
        <div class="set-group-label">常用</div>
        <div class="set-link" aria-current="page"><svg class="i"><use href="#i-cpu"/></svg>AI 模型</div>
        <div class="set-link"><svg class="i"><use href="#i-sun"/></svg>外观</div>
      </div>
      <div class="set-group">
        <div class="set-group-label">高级</div>
        <div class="set-link"><svg class="i"><use href="#i-search"/></svg>检索模型</div>
        <div class="set-link"><svg class="i"><use href="#i-globe"/></svg>网络代理</div>
        <div class="set-link"><svg class="i"><use href="#i-scroll-text"/></svg>提示词模板</div>
        <div class="set-link"><svg class="i"><use href="#i-puzzle"/></svg>写作 Skills</div>
      </div>
      <div class="set-group">
        <div class="set-group-label">其他</div>
        <div class="set-link"><svg class="i"><use href="#i-archive"/></svg>项目备份</div>
        <div class="set-link"><svg class="i"><use href="#i-info"/></svg>关于与更新</div>
      </div>
    </nav>

    <div class="set-body"><div class="set-inner">
      <div class="page-head">
        <div>
          <h1 class="h2">AI 模型</h1>
          <p class="lede" style="margin-top:6px;max-width:none">写作、审稿、修稿都用这里的模型。标为默认的模型会预先选好，每次运行前仍可临时换。</p>
        </div>
        <button class="btn btn-secondary"><svg class="i"><use href="#i-plus"/></svg>添加模型</button>
      </div>

      <div class="stack" style="margin-top:var(--s-6)">
        <div class="model">
          <div class="model-row">
            <span class="model-mark"><svg class="i"><use href="#i-cpu"/></svg></span>
            <div><div class="row"><span class="model-name">DeepSeek V4 Flash</span><span class="badge accent">默认</span></div>
              <div class="model-meta">DeepSeek · deepseek-v4-flash · 上次测试连接正常</div></div>
            <div class="model-act">
              <button class="btn btn-ghost btn-sm">编辑</button>
              <button class="btn btn-ghost btn-sm btn-icon" aria-label="更多操作" aria-expanded="true" style="background:var(--surface-2)"><svg class="i"><use href="#i-more"/></svg></button>
            </div>
          </div>
        </div>

        <div class="model" data-open="true">
          <div class="model-row">
            <span class="model-mark"><svg class="i"><use href="#i-cpu"/></svg></span>
            <div><div class="model-name">通义千问 长文</div>
              <div class="model-meta">硅基流动 · 正在编辑</div></div>
            <div class="model-act">
              <button class="btn btn-ghost btn-sm">设为默认</button>
              <button class="btn btn-ghost btn-sm btn-icon" aria-label="收起"><svg class="i"><use href="#i-x"/></svg></button>
            </div>
          </div>
          <div class="model-form">
            <div class="form-grid" style="gap:var(--s-4) var(--s-4)">
              <div class="field w3"><span class="label">名称 <em>只给你自己看</em></span><div class="input">通义千问 长文</div></div>
              <div class="field w3"><span class="label">服务商</span><div class="select">硅基流动 <svg class="i i-sm"><use href="#i-chevron-down"/></svg></div></div>
              <div class="field w6"><span class="label">模型名</span>
                <div class="with-btn"><div class="select">Qwen/Qwen3-235B-A22B <svg class="i i-sm"><use href="#i-chevron-down"/></svg></div>
                  <button class="btn btn-secondary"><svg class="i"><use href="#i-refresh-cw"/></svg>获取模型列表</button></div>
                <span class="help">列表里没有时，可以直接输入模型名</span></div>
              <div class="field w6"><span class="label">接口地址</span><div class="input mono">https://api.siliconflow.cn/v1</div></div>
              <div class="field w6"><span class="label">密钥 <em>只保存在本机</em></span>
                <div class="with-btn"><div class="input is-focus mono">sk-••••••••••••••••••••••••3f9a</div>
                  <button class="btn btn-secondary btn-icon" aria-label="显示密钥"><svg class="i"><use href="#i-eye-off"/></svg></button></div>
                <span class="help">没有密钥？<a style="color:var(--accent)">打开硅基流动控制台</a> · <a style="color:var(--accent)">查看官方文档</a></span></div>
              <div class="field w6">
                <div class="disclosure"><svg class="i i-sm"><use href="#i-chevron-right"/></svg>高级参数 <small>接口协议、上下文长度、推理能力、温度、单次最大输出、恢复默认</small></div>
              </div>
            </div>
            <div class="form-foot">
              <button class="btn btn-secondary"><svg class="i"><use href="#i-check-check"/></svg>测试连接</button>
              <span class="test-ok"><svg class="i i-sm"><use href="#i-circle-check"/></svg>连接正常，响应 1.2 秒</span>
              <span class="spacer"></span>
              <button class="btn btn-ghost">取消</button>
              <button class="btn btn-primary">保存</button>
            </div>
          </div>
        </div>

        <div class="model">
          <div class="model-row">
            <span class="model-mark"><svg class="i"><use href="#i-cpu"/></svg></span>
            <div><div class="model-name">本机 Ollama</div>
              <div class="model-meta">Ollama · qwen3:14b · 未测试</div></div>
            <div class="model-act">
              <button class="btn btn-ghost btn-sm">编辑</button>
              <button class="btn btn-ghost btn-sm btn-icon" aria-label="更多操作"><svg class="i"><use href="#i-more"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </div></div>
  </div>
</template>

<template id="overlay">
  <div class="menu" style="right:165px;top:234px" role="menu">
        <button class="menu-item" role="menuitem"><svg class="i"><use href="#i-copy"/></svg>复制为新模型</button>
    <div class="menu-sep"></div>
    <button class="menu-item danger" role="menuitem"><svg class="i"><use href="#i-trash-2"/></svg>删除模型…</button>
  </div>
</template>

<script src="icons.js"></script>
<script src="shell.js"></script>
<script>
Shell.mount({ title: '设置 · AI 模型', ref: 'settings', chapters: false, crumbs: ['设置', 'AI 模型'] });
</script>
</body>
</html>
