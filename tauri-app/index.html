<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/branding/app-icon-light.svg" />
    <title>Lorekeeper 设定司</title>
  </head>
  <body style="margin: 0;">
    <!-- 同步读取主题，避免加载页与主界面背景色闪跳 -->
    <script>
      (function() {
        var bgMap = { light: '#F7F3E8', galaxy: '#0A1628', paper: '#F7F3E8', dark: '#1E1E1E' };
        var theme = 'paper';
        try {
          var raw = localStorage.getItem('ai-novel-writer-theme');
          if (raw) {
            var state = JSON.parse(raw).state || {};
            var candidate = state.resolvedTheme || state.theme;
            if (candidate === 'night') candidate = 'dark'; // 兼容旧版
            if (Object.prototype.hasOwnProperty.call(bgMap, candidate)) {
              theme = candidate;
            }
          }
        } catch(e) {}
        
        var bg = bgMap[theme] || bgMap.galaxy;
        
        // 提前给 html 注入主题 class，确保所有全局 CSS 变量立即生效
        document.documentElement.classList.remove('light', 'dark', 'galaxy', 'paper');
        document.documentElement.classList.add(theme);
        
        document.body.style.backgroundColor = bg;
        /* 将背景色注入 CSS 变量供启动加载器引用 */
        document.documentElement.style.setProperty('--loader-bg', bg);
      })();
    </script>
    <div id="root">
      <style>
        .ai-writer-initial-loader {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: 100vh;
          width: 100vw;
          background-color: var(--loader-bg, #0A1628);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          user-select: none;
        }
        
        .ai-writer-core-container {
          position: relative;
          width: 80px;
          height: 80px;
          display: flex;
          justify-content: center;
          align-items: center;
          margin-bottom: 24px;
        }

        .ai-writer-brand-icon {
          display: block;
          width: 80px;
          height: 80px;
        }

        .ai-writer-brand-dark,
        .dark .ai-writer-brand-light,
        .galaxy .ai-writer-brand-light {
          display: none;
        }

        .dark .ai-writer-brand-dark,
        .galaxy .ai-writer-brand-dark {
          display: block;
        }

        .ai-writer-text {
          font-size: 13px;
          font-weight: 500;
          letter-spacing: 4px;
          text-transform: uppercase;
          background: linear-gradient(90deg, #B5402C, #54666E, #527A5B, #B5402C);
          background-size: 200% auto;
          color: transparent;
          -webkit-background-clip: text;
          background-clip: text;
          animation: ai-writer-text-shine 3s linear infinite;
        }

        @keyframes ai-writer-text-shine {
          to { background-position: 200% center; }
        }
      </style>
      <div class="ai-writer-initial-loader">
        <div class="ai-writer-core-container">
          <img class="ai-writer-brand-icon ai-writer-brand-light" src="/branding/app-icon-light.svg" width="80" height="80" alt="" aria-hidden="true" draggable="false" />
          <img class="ai-writer-brand-icon ai-writer-brand-dark" src="/branding/app-icon-dark.svg" width="80" height="80" alt="" aria-hidden="true" draggable="false" />
        </div>
        <div class="ai-writer-text">Lorekeeper 设定司 初始化中</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
