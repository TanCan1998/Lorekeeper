[package]
name = "lorekeeper"
version = "1.1.0"
description = "AI Novel Writer — 本地优先的长篇小说创作工作台（Tauri 2 后端）"
edition = "2021"

# 迁移自 Electron 主进程（electron/）。迁移期间 Electron 保留可运行，
# 本 crate 仅承载 Tauri 侧实现；分层映射见 docs-fork/agents/pi-development.md。

[lib]
# lib.rs 独立于 main.rs，便于桌面/移动端复用与单元测试。
name = "lorekeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
# 角色名单/蓝图/定稿的规范 JSON 哈希（SHA-256 小写 hex）。
# 已随 tauri 依赖树存在于 Cargo.lock（0.10.9），声明为直接依赖不产生任何新下载。
sha2 = "0.10"
# WHATWG URL 解析 —— 批次 D2 对齐基线 `new URL()` 语义（端点规范化 / 指纹）。
# 同样已在 Cargo.lock（tauri → reqwest 的传递依赖），声明为直接依赖不产生任何新下载。
url = "2"
# 基线 `stripThinking()` 的三条替换规则（`<think>` 剥离链）。
# 已在 Cargo.lock（1.13.1），声明为直接依赖不产生任何新下载。
regex = "1"
# 批次 E：定稿导入字数契约 countDraftUnits 的 NFC 归一化前置。
# 纯 Rust、无传递依赖（Ask first 已批准 2026-10-09）。
unicode-normalization = "0.1"

# 批次 F2（方案 B：自研混合检索）—— 双路检索依赖，均为纯 Rust 生态。
#
# hnsw_rs 0.3.4：HNSW 近似最近邻图（向量语义检索）。无 C/C++ 绑定、无构建链。
# 已由方案 C 验证通过（`examples/hnsw_validation.rs`），现正式工程化为
# `src/db/vector.rs` 的 `LocalVectorIndex`（双向 ID 映射 + 内存墓碑 + 二进制图快照）。
hnsw_rs = "0.3.4"
# 批次 B5：头像压缩纯逻辑（移植 `electron/services/avatar-image.ts`）。
# 纯 Rust 解码/编码（魔数检测 + PNG/JPEG 重编码）；default-features 关闭，
# 只勾 png/jpeg/webp 三 codec，避免拉入 gif/bmp/tiff 等无用解码器。
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
# jieba-rs 0.7.0：中文分词（关键词检索路径 `/ FTS5 预分词 / 查询分词`）。
# 本批次先行声明，供 F2 的 `fts` 子层消费；向量层本身不依赖它。
jieba-rs = "0.7.0"
# 并发原语：向 量与 ID 映射以 `Arc<tokio::sync::RwLock<_>>` 常驻 Tauri State，
# 支撑 `&self` 下的并发读（search）/ 写（insert / delete / load）。
# tokio 1.53 已在 Cargo.lock（tauri 传递依赖），此处仅提升为直接依赖并启用
# 最小 feature 集：sync（读写锁）+ rt/macros（仅单元测试的异步执行器）
# + time（B3-2b 生成运行服务的 1 秒 flush 定时器与 active-elapsed
# deadline；tokio 已是直接依赖，启用内置 feature 不新增依赖、不改 lock）。
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "fs", "io-util"] }
# 批次 D2-b：LLM 生成 / 流式（对齐基线 `fetch` + 手写 SSE 行解析）。
#
# ⚠️ 必须 `default-features = false`：reqwest 0.13 的 `default = ["default-tls", ...]`，
# 而 `default-tls = ["rustls"]` —— rustls 会拉 `aws-lc-rs`，本机无 CMake/C 构建链，
# 必然编译失败。`native-tls` 在 Windows 走 `schannel`（纯 FFI），无需构建链。
# 刻意不启用：`charset`（基线 Node `res.text()` 恒按 UTF-8 解码）、`http2`
# （Node fetch/undici 为 HTTP/1.1）、`system-proxy`（代理在代码内显式装配）。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "native-tls",
    "socks",
] }

# 批次 B 遗留补齐（2026-10-08，Ask first 已批准）：`dialog:select-folder` 的原生目录选择。
#
# 选官方插件而非直连 `rfd`：自带父窗口绑定（对话框不被无边框主窗口遮挡）与移动端实现。
# Windows x64 实测增量：**+8 个编译单元 / 约 3.5 MB 下载**（本机 `cargo tree` 对照；
# 其中 `windows-sys 0.60` 等 3 个包与既有 `windows 0.62` 版本分叉，由 rfd 0.16 决定，
# 换方案也躲不掉）。release 二进制约 +0.1–0.3 MB（社区实测 plugins-workspace#1085 为 +0.13 MB）。
#
# 注意：会**连带引入 `tauri-plugin-fs`**（插件的硬依赖）——批次 H 的 fs 授权域将来
# 可直接复用，届时勿重复引入。
# 保持默认 features（`gtk3`）：该 feature 只影响 Linux/BSD 的 rfd 后端，Windows/macOS 无差异。
tauri-plugin-dialog = "2"

# 批次 H（B12，2026-10-09 Ask first 已批准）：打开外部链接。
#
# 动因：`official-homepage:open` 与 `model-provider-resource:open` 此前是**假成功占位**
# （返回 success:true 但不打开任何 URL），H3 的 `update:open-release` 也需要同一能力。
# 选官方 `tauri-plugin-opener`（而非 `tauri-plugin-shell`）：仅需「显式打开一个 URL」，
# 不必引入完整 shell 执行面。
#
# 能力边界：本插件仅由 **Rust 侧**调用（`external_link.rs`），URL 均为编译期常量；
# 渲染层不引入 `@tauri-apps/plugin-opener`，故**未**在 capabilities 中开放 opener 权限
# （权限系统只门禁「渲染层→插件命令」，我们不开这条通道）。
tauri-plugin-opener = "2"
# 批次 B111（Ask first 已批准 2026-10-16）：便携项目归档（.ainovel）容器读写。
#
# 动因：基线 `electron/services/portable-project-archive.ts` 是标准 ZIP —— 自研 writer 写
# **store** 模式 + yauzl 读取，含 Zip64 / data descriptor / UTF-8 文件名标志；Rust 侧容器层
# 需要同构的读写面（B112 导出 / B113 恢复频道消费）。
#
# 选官方 `zip` 而非自研：Zip64 / central directory / CRC32 已成熟且纯 Rust（自身无 C 绑定）。
# 本机 `cargo add` 实测增量：**4 个包约 0.66 MB**（zip 172KB + typed-path 110KB +
# zopfli 51KB + nix 339KB，其中 nix 仅 Unix 编译），首次 `cargo check` 约 +3.7 秒。
#
# `default-features = false` 关掉 aes / bzip2 / zstd / lzma / ppmd / deflate64 与 chrono 等
# 无关算法及 `zstd-sys`（C 构建链），只保留 `deflate` 以读取**可能存在的 deflate 条目**；
# 写出恒用 `Stored`，与基线 writer 的压缩方法一致（`zlib-rs` 为纯 Rust，无构建链）。
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

# 批次 G1（Ask first 已批准 2026-10-10）：Windows 文件标识。
#
# 动因：`defaultFileIdentity` 需要 `dev:…:ino:…`，但 std 的
# `MetadataExt::file_index/volume_serial_number` 仍属 unstable（`windows_by_handle`，
# rustc 1.99 实测 E0658）。改用 `GetFileInformationByHandle`。
#
# 版本/体积：0.61.2 **已在 Cargo.lock**（tauri/reqwest 等的传递依赖），
# 提升为直接依赖不产生任何新下载；仅按需勾选两个 Win32 模块 feature。
# 作用域限定 `cfg(windows)`，不污染其他平台构建。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # 已批准：当前 Windows 用户 DPAPI 云凭据保护（非机器范围）。
    "Win32_Security_Cryptography",
] }

# 按需引入（不提前加，避免无用编译）：
# - rusqlite（bundled feature，避免依赖系统 sqlite）→ 批次 C 数据库层
# - tauri-plugin-{updater,shell,notification} → 批次 H 按频道批准

[profile.dev]
incremental = true
# 测试构建提速（2026-10-17 实测，16 核本机）：
# - debug = 0：改一行源码后的重编 + 链接从 ~70.9s 降到 ~48.6s（panic 仍显示文件:行）；
#   需要断点调试时用 CARGO_PROFILE_TEST_DEBUG=1 临时覆盖。
# - incremental = false：单一大 crate 的增量缓存帮助有限，却长期占用 GB 级磁盘。
[profile.test]
debug = 0
incremental = false
