name: Tauri release package

# 默认只打包；仅手动明确选择publish时，独立作业创建新标签与Release。
# - 打包作业始终只读；写权限仅限独立发布作业；
# - 三平台全部成功、大小/SHA256核验后先上传草稿，再核验远端资产后公开；
# - 不覆盖已有标签/Release/资产，不在打包工作流运行测试；
# - 签名范围：macOS 为 ad-hoc（未配置开发者证书），Windows 未签名。
#
# 平台矩阵对齐上游 Electron 资格流的三条路径（Windows x64 / macOS ARM64 / macOS Intel），
# 但这里是 Tauri 2 的真实安装包产出，不是资格测试。

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: '要打包的完整 40 位提交 SHA（留空 = 触发 ref 的 HEAD）'
        required: false
        type: string
      publish:
        description: '明确发布GitHub Release（默认只打包）'
        required: true
        default: false
        type: boolean
      prerelease:
        description: '标为预发布，不设为最新版'
        required: true
        default: true
        type: boolean
      make_latest:
        description: '设为最新版（仅允许非预发布；beta名称仍标注预览）'
        required: true
        default: false
        type: boolean
      release_tag:
        description: '新标签（留空=lorekeeper-v版本；已有标签拒绝覆盖）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-release-package-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: '1.99.0'

jobs:
  prepare:
    name: 准备并锁定发布目标
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: 检出目标
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false
      - name: 设置Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: 校验版本与新标签
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
          PUBLISH: ${{ inputs.publish }}
          PRERELEASE: ${{ inputs.prerelease }}
          MAKE_LATEST: ${{ inputs.make_latest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node tauri-app/scripts/prepare-release.mjs

  package:
    needs: prepare
    env:
      PACKAGE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-2022
            bundles: nsis,msi
          - label: macos-arm64
            runner: macos-14
            bundles: dmg
          - label: macos-x64
            runner: macos-15-intel
            bundles: dmg

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      # 版本只取自 tauri-app/package.json 的 packageManager：
      # 根 package.json 属 Electron 基线（仍固定 11.11.0），若再写 version，
      # action 会因“Multiple versions of pnpm specified”直接失败。
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: tauri-app/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: tauri-app/pnpm-lock.yaml

      # 与 tauri-rust-ci 使用同一固定工具链，避免浮动标签。
      - name: Install fixed Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup run "$RUSTUP_TOOLCHAIN" rustc --version --verbose
          rustup run "$RUSTUP_TOOLCHAIN" cargo --version

      - name: Install locked dependencies
        working-directory: tauri-app
        run: pnpm install --frozen-lockfile

      # 先构建前端并体检，再打包：安装包一旦生成就无法在中间拦截内容。
      - name: Build frontend
        working-directory: tauri-app
        run: pnpm build

      - name: Assert packaged frontend contents
        working-directory: tauri-app
        run: node scripts/assert-package-contents.mjs --dist dist

      # tauri build 会按 beforeBuildCommand 再跑一次前端构建（本仓库约 3 秒）。
      # 上一步已用同样输入构建并校验，Vite 产物按内容哈希、可重复，故此处不再覆盖配置，
      # 以免引入只存在于 runner 的临时配置文件。
      - name: Package installers
        working-directory: tauri-app
        shell: bash
        run: pnpm tauri build --bundles "${{ matrix.bundles }}"

      - name: Record package manifest
        working-directory: tauri-app
        shell: bash
        run: node scripts/package-manifest.mjs --out "$RUNNER_TEMP/tauri-package"

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-release-${{ matrix.label }}-${{ needs.prepare.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tauri-app/src-tauri/target/release/bundle/nsis/*.exe
            tauri-app/src-tauri/target/release/bundle/msi/*.msi
            tauri-app/src-tauri/target/release/bundle/dmg/*.dmg
            ${{ runner.temp }}/tauri-package/manifest.json
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  publish:
    name: 核验并发布GitHub Release
    needs: [prepare, package]
    if: ${{ inputs.publish && github.repository == 'TanCan1998/Lorekeeper' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: atomgit-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: 检出已锁定目标
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: 设置Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: 下载本次三平台产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tauri-release-*-${{ needs.prepare.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-input
          merge-multiple: false
      - name: 核验大小摘要并发布
        env:
          GH_TOKEN: ${{ github.token }}
          ATOMGIT_ACCESS_TOKEN: ${{ secrets.ATOMGIT_ACCESS_TOKEN }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.source_sha }}
          PUBLISH: ${{ inputs.publish }}
          PRERELEASE: ${{ inputs.prerelease }}
          MAKE_LATEST: ${{ inputs.make_latest }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ARTIFACT_ROOT: ${{ runner.temp }}/release-input
          RELEASE_OUTPUT: ${{ runner.temp }}/validated-release
        run: node tauri-app/scripts/publish-release.mjs
