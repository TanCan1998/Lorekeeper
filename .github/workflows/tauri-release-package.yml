name: Tauri release package

# 只打包，不发布。
# - 不创建 GitHub Release、不打 tag、不写仓库内容；
# - 产物仅作为本 run 的 artifacts 保留，供人工下载核验；
# - 签名范围：macOS 为 ad-hoc（未配置开发者证书），Windows 未签名。
#
# 平台矩阵对齐上游 Electron 资格流的三条路径（Windows x64 / macOS ARM64 / macOS Intel），
# 但这里是 Tauri 2 的真实安装包产出，不是资格测试。

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: '要打包的完整 40 位提交 SHA（留空 = 触发 ref 的 HEAD）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-release-package-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: '1.99.0'

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-2022
            bundles: nsis,msi
          - label: macos-arm64
            runner: macos-14
            bundles: dmg
          - label: macos-x64
            runner: macos-15-intel
            bundles: dmg

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: tauri-app/pnpm-lock.yaml

      # 与 tauri-rust-ci 使用同一固定工具链，避免浮动标签。
      - name: Install fixed Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup run "$RUSTUP_TOOLCHAIN" rustc --version --verbose
          rustup run "$RUSTUP_TOOLCHAIN" cargo --version

      - name: Install locked dependencies
        working-directory: tauri-app
        run: pnpm install --frozen-lockfile

      # 先构建前端并体检，再打包：安装包一旦生成就无法在中间拦截内容。
      - name: Build frontend
        working-directory: tauri-app
        run: pnpm build

      - name: Assert packaged frontend contents
        working-directory: tauri-app
        run: node scripts/assert-package-contents.mjs --dist dist

      # tauri build 会按 beforeBuildCommand 再跑一次前端构建（本仓库约 3 秒）。
      # 上一步已用同样输入构建并校验，Vite 产物按内容哈希、可重复，故此处不再覆盖配置，
      # 以免引入只存在于 runner 的临时配置文件。
      - name: Package installers
        working-directory: tauri-app
        shell: bash
        run: pnpm tauri build --bundles "${{ matrix.bundles }}"

      - name: Record package manifest
        working-directory: tauri-app
        shell: bash
        run: node scripts/package-manifest.mjs --out "$RUNNER_TEMP/tauri-package"

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-release-${{ matrix.label }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tauri-app/src-tauri/target/release/bundle/nsis/*.exe
            tauri-app/src-tauri/target/release/bundle/msi/*.msi
            tauri-app/src-tauri/target/release/bundle/dmg/*.dmg
            ${{ runner.temp }}/tauri-package/manifest.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
